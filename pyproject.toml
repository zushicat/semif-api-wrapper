[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semif-api-jev-schema"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # API
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "requests==2.34.2",
  # SemIf core stack (imported by semif_phase1.core even in mlx mode)
  "torch==2.10.0",
  "transformers==5.17.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.2",
  "numpy==2.2.6",
  "sentencepiece==0.2.1",
  "protobuf==7.36.1",
  "pytest==8.4.2",
]

[project.optional-dependencies]
mlx = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@a63e24c389382619eb6d9af656e3b46024be217a ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
test = [
  "pytest-asyncio==1.4.0",
]

[project.scripts]
semif-score = "semif_phase1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["semif_phase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
